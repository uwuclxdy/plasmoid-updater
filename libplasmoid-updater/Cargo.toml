[package]
name = "libplasmoid-updater"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Library for updating KDE Plasma 6 components from the KDE Store. Meant for use in topgrade."
keywords = ["kde", "plasma", "widgets", "updater", "plasmoid"]
categories = ["development-tools"]
readme = "README.md"
repository = "https://github.com/uwuclxdy/plasmoid-updater"
homepage = "https://github.com/uwuclxdy/plasmoid-updater"
documentation = "https://docs.rs/libplasmoid-updater"

[features]
default = ["cli", "inhibit"]
cli = ["indicatif", "comfy-table", "bytesize", "inquire", "is-terminal", "terminal_size"]
inhibit = ["zbus"]
debug = []

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "rustls",
] }
quick-xml = { version = "0.40.1", features = ["serialize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
dirs = "6.0.0"
thiserror = "2.0.18"
log = "0.4.32"
md5 = "0.8.0"
regex = "1.12.4"
rayon = "1.12.0"
parking_lot = "0.12.5"
versions = "7.0.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
fs_extra = "1.3.0"
tempfile = "3.27.0"
# 2.0.1 hard-pins `indexmap =2.11.4`, conflicting with toml's `indexmap ^2.14`; 2.0.0 uses flexible `^2.6`
freedesktop_entry_parser = "=2.0.0"
nix = { version = "0.31.3", features = ["fs", "user"] }
zbus = { version = "5.16.0", default-features = false, features = ["async-io", "blocking-api"], optional = true }

# CLI-only dependencies
indicatif = { version = "0.18.4", optional = true }
comfy-table = { version = "7.2.2", optional = true }
bytesize = { version = "2.4.0", optional = true }
inquire = { version = "0.9.4", optional = true }
is-terminal = { version = "0.4.17", optional = true }
terminal_size = { version = "0.4.4", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
