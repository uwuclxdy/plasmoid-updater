[package]
name = "libplasmoid-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Library for updating KDE Plasma 6 components from the KDE Store. Meant for use in topgrade."
keywords = ["kde", "plasma", "widgets", "updater", "plasmoid"]
categories = ["development-tools"]
readme = "README.md"
homepage = "https://github.com/uwuclxdy/plasmoid-updater"
documentation = "https://docs.rs/libplasmoid-updater"

[features]
default = ["cli", "inhibit"]
cli = ["comfy-table", "bytesize", "inquire"]
inhibit = ["zbus"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde = { workspace = true }
serde_json = "1.0.154"
dirs = { workspace = true }
thiserror = "2.0.21"
log = "0.4.35"
md5 = "0.8.1"
regex = "1.13.1"
rayon = "1.12.0"
parking_lot = "0.13.0"
versions = "8.0.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tempfile = "3.27.0"
# 2.0.1 hard-pins `indexmap =2.11.4`, which conflicts with toml's `indexmap ^2.13`; the resolver keeps 2.0.0 here
freedesktop_entry_parser = "2.0.0"
nix = { workspace = true, features = ["fs"] }
zbus = { version = "6.2.0", default-features = false, features = ["default-rt"], optional = true }

# CLI-only dependencies
comfy-table = { version = "8.0.1", optional = true }
bytesize = { version = "2.7.0", optional = true }
inquire = { version = "0.9.4", optional = true }

[lints]
workspace = true
