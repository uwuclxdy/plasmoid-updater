# Build the release binary on a `v*` tag and attach the named asset plus a
# sha256sums.txt over it to the GitHub Release. The sums file is what a
# self-updater or installer verifies downloads against.
#
# The GitHub release is NOT created here — the repo's release.sh creates it
# right after the tag push with the full changelog already in the body, so the
# notes ride along in GitHub's release email. This workflow only builds the
# binary and uploads it (plus sums) to that release. One upload point (the
# publish job), so no concurrent release-create can duplicate the release and
# orphan the notes. If the release does not exist when publish runs (the script
# never ran for this tag), the publish job fails rather than minting a
# notes-less release.
#
# The build matrix runs the one target on its NATIVE runner (linux → ubuntu).
# Linux-only binary today: add rows (macos / windows / musl) to extend the
# asset set; asset names are what downloaders verify against.
#
# Unsigned variant: sha256-only. GitHub also stamps an immutable per-asset
# sha256 digest on every upload, which covers a missing sums file.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # gh release upload attaches assets to the release
  id-token: write      # GitHub OIDC — keyless build-provenance attestation
  attestations: write  # actions/attest-build-provenance

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag is semver
        # Tightens the `v*` trigger to strict vX.Y.Z before any build minutes burn —
        # a malformed tag otherwise reds publish on the missing artifact. Pre-release
        # suffixes (`v1.2.3-rc1`) need the regex relaxed.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '${GITHUB_REF_NAME}' is not vX.Y.Z"; exit 1
          fi

  build:
    name: Build ${{ matrix.asset_name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # windows rows need Git Bash; keeps cp + forward-slash paths uniform across OSes
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: plasmoid-updater-linux-x86_64
            ext: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Prepare asset
        run: cp "target/${{ matrix.target }}/release/plasmoid-updater${{ matrix.ext }}" "${{ matrix.asset_name }}${{ matrix.ext }}"
      - name: Attest build provenance   # keyless SLSA provenance for the asset
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.asset_name }}${{ matrix.ext }}
      - name: Upload artifact for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}${{ matrix.ext }}
          path: ${{ matrix.asset_name }}${{ matrix.ext }}
          if-no-files-found: error

  publish:
    name: Publish assets
    needs: [build]
    # Run even when a build leg fails so the binaries that DID ship still get
    # attached with a matching sums file covering exactly what was published.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate sha256sums.txt
        # Glob whatever was actually built so a partial release still matches.
        run: |
          cd artifacts
          sha256sum plasmoid-updater-* > sha256sums.txt
      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # release.sh creates the release (with the full notes) right after the
        # tag push; a missing release here means that step never ran, so this
        # job refuses instead of minting a notes-less release. --clobber keeps
        # re-runs idempotent.
        run: |
          cd artifacts
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::release ${GITHUB_REF_NAME} does not exist; if release.sh's create step failed, run from the repo root: echo y | ./release.sh --retry --workspace --notes CHANGELOG_FILE ${GITHUB_REF_NAME#v}, then re-run this job so the assets attach: gh run rerun ${GITHUB_RUN_ID} --failed — if the tag was hand-pushed, delete it and rerun release.sh"
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" plasmoid-updater-* sha256sums.txt --clobber --repo "${GITHUB_REPOSITORY}"
