# Build the release binary on a `v*` tag and attach the named asset plus a
# sha256sums.txt over it to the GitHub Release. The sums file is what a
# self-updater or installer verifies downloads against.
#
# The GitHub release is NOT created here — the release is created with its
# notes before this workflow runs, so the notes ride along in GitHub's release
# email. This workflow builds the binary and uploads it (plus sums) to that
# release, and the crates job publishes the library, then the binary, to
# crates.io through trusted publishing, so no crates.io token is stored in the
# repo. One upload point (the publish job), so no concurrent release-create can
# duplicate the release and orphan the notes. If the release does not exist
# when publish runs, the publish job fails rather than minting a notes-less
# release.
#
# The build matrix runs the one target on its NATIVE runner (linux → ubuntu).
# Linux-only binary today: add rows (macos / windows / musl) to extend the
# asset set; asset names are what downloaders verify against.
#
# Unsigned variant: sha256-only. GitHub also stamps an immutable per-asset
# sha256 digest on every upload, which covers a missing sums file.

name: release

on:
  push:
    tags: ["v*"]

# Each job takes only what it uses: build compiles every dependency and
# package builds both crates from their packages, so each holds
# `contents: read` alone and no token that can change the release or buy a
# registry token; validate reads the tree; publish uploads the assets and
# attests the downloaded binaries.
permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    # Tag guard on every job: a second trigger or a hand-dispatched run must
    # never reach the builds or the publish step without a v* tag.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag is semver
        # Tightens the `v*` trigger to vX.Y.Z or a vX.Y.Z-PRE prerelease (semver
        # 2.0.0's pre-release grammar, no build metadata) before any build
        # minutes burn — a malformed tag otherwise reds publish on the missing
        # artifact. LC_ALL=C: under a UTF-8 locale bash's [A-Za-z0-9] also
        # matches é and ٣ (measured 2026-11-10, bash 5.3 on en_US.UTF-8).
        run: |
          ver="${GITHUB_REF_NAME#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          LC_ALL=C
          if [[ ! "$ver" =~ $semver ]]; then
            echo "::error::tag '${GITHUB_REF_NAME}' is not vX.Y.Z or vX.Y.Z-PRERELEASE"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # no step here talks to the repo, so the checkout keeps no token
          persist-credentials: false
      # cargo metadata below reads the workspace manifest
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Refuse a tag the workspace version does not match
        # The crates job publishes the manifest's version, so a tag naming any
        # other version would release binaries and crates that disagree.
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[].version] | unique | join(" ")')"
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the workspace version '${version}'; a release bumps the version and tags it together, so a hand-pushed tag must not skip the bump"
            exit 1
          fi

  build:
    name: Build ${{ matrix.asset_name }}
    needs: validate
    permissions:
      contents: read
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # windows rows need Git Bash; keeps cp + forward-slash paths uniform across OSes
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: plasmoid-updater-linux-x86_64
            ext: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # the build compiles every dependency and needs no git credential
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Prepare asset
        run: cp "target/${{ matrix.target }}/release/plasmoid-updater${{ matrix.ext }}" "${{ matrix.asset_name }}${{ matrix.ext }}"
      - name: Upload artifact for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.asset_name }}${{ matrix.ext }}
          path: ${{ matrix.asset_name }}${{ matrix.ext }}
          if-no-files-found: error

  package:
    name: Build both crates from their packages
    needs: validate
    permissions:
      contents: read
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Same registry-download workaround as ci.yml: curl's HTTP/2 multiplexing
    # against the crates.io CDN intermittently dies with "[16] Error in the
    # HTTP2 framing layer" on the hosted runners, and the extra retries cover
    # the remaining transient blips. `cargo package` verifies each package by
    # building it, the binary's against the library's package, which downloads
    # the whole dependency tree from that CDN.
    env:
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_MULTIPLEXING: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # the package build runs every dependency's build script and needs
          # no git credential
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # The verify build runs inside `cargo package`, so it runs here, in a
      # job that holds no registry token and cannot ask for an OIDC one.
      - name: Build both crates from their packages
        run: cargo package --locked --workspace

  publish:
    name: Publish assets
    needs: [validate, build]
    permissions:
      contents: write      # gh release upload attaches assets to the release
      id-token: write      # GitHub OIDC — keyless build-provenance attestation
      attestations: write  # actions/attest-build-provenance
    # Run even when a build leg fails so the binaries that DID ship still get
    # attached with a matching sums file covering exactly what was published.
    # A failed validate skips every build leg, so there is nothing to attach:
    # publish then stays out and leaves the validate failure as the one red.
    # `!cancelled()`, not `always()`: always() also runs on a cancelled run,
    # which must upload nothing. The tag guard still holds. The `${{ }}` is
    # needed: a YAML value cannot start with a bare `!`.
    if: ${{ !cancelled() && needs.validate.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Attest build provenance   # keyless SLSA provenance over the downloaded binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: artifacts/plasmoid-updater-*
      - name: Generate sha256sums.txt
        # Glob whatever was actually built so a partial release still matches.
        run: |
          cd artifacts
          sha256sum plasmoid-updater-* > sha256sums.txt
      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The release is created with its notes before this workflow runs. A
        # missing release here means that never happened for this tag, so this
        # job refuses instead of minting a notes-less release. Any other gh
        # failure refuses too: without the missing-release answer it cannot
        # tell whether the release exists. --clobber keeps re-runs idempotent.
        run: |
          cd artifacts
          if view_err="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" 2>&1 >/dev/null)"; then
            gh release upload "${GITHUB_REF_NAME}" plasmoid-updater-* sha256sums.txt --clobber --repo "${GITHUB_REPOSITORY}"
          elif [ "$view_err" = "release not found" ]; then
            echo "::error::release ${GITHUB_REF_NAME} does not exist; if the release run that pushed this tag failed before creating it, resume that run with --retry, then re-run this job so the assets attach: gh run rerun ${GITHUB_RUN_ID} --failed — if the tag was pushed by hand, release the next version"
            exit 1
          else
            echo "::error::cannot tell whether release ${GITHUB_REF_NAME} exists (gh release view: ${view_err%%$'\n'*}); re-run this job once gh answers: gh run rerun ${GITHUB_RUN_ID} --failed"
            exit 1
          fi

  crates:
    name: Publish to crates.io
    needs: [validate, build, publish, package]
    permissions:
      contents: read
      id-token: write      # GitHub OIDC — crates.io trusted publishing, no stored token
    # Same registry-download workaround as ci.yml: curl's HTTP/2 multiplexing
    # against the crates.io CDN intermittently dies with "[16] Error in the
    # HTTP2 framing layer" on the hosted runners, and the extra retries cover
    # the remaining transient blips. This job builds nothing, but its index
    # reads and its uploads still reach crates.io.
    env:
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_MULTIPLEXING: "false"
    # No always(): unlike an asset, a published crate version cannot be
    # replaced, so this job runs only when validate, every build leg, the
    # release upload and the package build all succeeded (a failed needed job
    # skips it).
    if: startsWith(github.ref, 'refs/tags/')
    # A second run for the same tag waits instead of racing the first to
    # crates.io's duplicate refusal, then counts what the first published as
    # done. GitHub keeps only one pending run per group: a third arrival
    # cancels the second while it still waits, so the queue never holds more
    # than one.
    concurrency:
      group: crates-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # cargo publish packages the tree and needs no git credential
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # The trusted publisher registered on crates.io for this repo and
      # release.yml is what lets the job's OIDC token buy a registry token.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish the crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # --no-verify uploads the packed crate without building it: that build
        # runs every dependency's build script, and this step holds the
        # registry token. The binary depends on the library by version, so the
        # library goes first, and a failed library publish stops the step
        # before the binary. A version crates.io already has counts as done:
        # cargo refuses it with "already exists on crates.io index", or the
        # registry with "is already uploaded". Any other failure fails the
        # step.
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          log="$(mktemp)"
          trap 'rm -f -- "$log"' EXIT
          for crate in libplasmoid-updater plasmoid-updater; do
            if cargo publish --locked --no-verify -p "$crate" 2>&1 | tee "$log"; then
              continue
            fi
            if grep -Fq -e 'already exists on crates.io index' -e 'is already uploaded' -- "$log"; then
              echo "${crate} ${ver} is already on crates.io; counting it as published"
            else
              exit 1
            fi
          done
