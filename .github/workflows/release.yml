# Build the release binary on a `v*` tag and attach the named asset plus a
# sha256sums.txt over it to the GitHub Release. The sums file is what a
# self-updater or installer verifies downloads against.
#
# The GitHub release is NOT created here — the repo's release.sh creates it
# right after the tag push with the full changelog already in the body, so the
# notes ride along in GitHub's release email. This workflow builds the binary
# and uploads it (plus sums) to that release, and the crates job publishes the
# library, then the binary, to crates.io through trusted publishing, so no
# crates.io token is stored in the repo. One upload point (the publish job), so
# no concurrent release-create can duplicate the release and orphan the notes.
# If the release does not exist when publish runs (the script never ran for
# this tag), the publish job fails rather than minting a notes-less release.
#
# The build matrix runs the one target on its NATIVE runner (linux → ubuntu).
# Linux-only binary today: add rows (macos / windows / musl) to extend the
# asset set; asset names are what downloaders verify against.
#
# Unsigned variant: sha256-only. GitHub also stamps an immutable per-asset
# sha256 digest on every upload, which covers a missing sums file.

name: release

on:
  push:
    tags: ["v*"]

# Each job takes only what it uses: validate and build compile every
# dependency, so neither holds the token that can change the release.
permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    # Tag guard on every job: a second trigger or a hand-dispatched run must
    # never reach the builds or the publish step without a v* tag.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag is semver
        # Tightens the `v*` trigger to strict vX.Y.Z before any build minutes burn —
        # a malformed tag otherwise reds publish on the missing artifact. Pre-release
        # suffixes (`v1.2.3-rc1`) need the regex relaxed.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '${GITHUB_REF_NAME}' is not vX.Y.Z"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # the baseline is the newest origin tag HEAD contains, which needs the
          # history and the tags, not the triggering tag alone
          fetch-depth: 0
          # the guard below only runs git ls-remote against the public repo, so
          # the token need not sit in .git/config while code is compiled
          persist-credentials: false
      - name: Refuse a version crates.io holds from another commit
        # crates.io versions are immutable: a tag re-pushed at another commit
        # after its crates went up would build and upload binaries that never
        # match crates.io's copy, so refuse it before any build or upload.
        # Only `other` fails; absent/same/unknown pass and are logged: a CDN
        # blip must not block a tag release.sh already cleared, and the crates
        # job asks again, where crates.io refuses a real duplicate.
        # scripts/crates-io-copy.sh is the one check release.sh and the crates
        # job share.
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse HEAD)"
          for crate in libplasmoid-updater plasmoid-updater; do
            answer="$(bash scripts/crates-io-copy.sh "$crate" "$ver")"
            echo "crates.io's ${crate} ${ver}: ${answer}"
            case "$answer" in
              "other "*)
                echo "::error::${crate} ${ver} is already on crates.io but was packed from ${answer#other }, not from this tag's ${commit}; crates.io versions are immutable, so this tag can never publish it: bump to a new version (delete the GitHub release, if release.sh made one, and the tag, then release the next version)" >&2
                exit 1
                ;;
            esac
          done
      # The toolchain builds the rustdoc JSON the tool reads, and the tool
      # reads only the formats of the toolchains it was released against, so
      # the two pins move together (ci.yml's semver job carries the same pair,
      # and scripts/semver-guard.sh's SEMVER_TOOLCHAIN, which release.sh's
      # local check runs on, must equal this toolchain).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
        with:
          tool: cargo-semver-checks@0.51.0
      - name: Check the library's API against its previous release tag
        # Release time, not per push: main carries the next version's
        # (possibly breaking) API before the bump that announces it. The
        # baseline, the release type and the check all come from
        # scripts/semver-guard.sh, the one implementation release.sh shares:
        # the baseline is the newest origin v* tag below this one that the tag's
        # commit contains (never crates.io, which gets a version only after its
        # tag, so a failed crates job leaves it behind origin), and
        # the release type follows from that baseline version to the tag's.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest_ver="$(bash scripts/semver-guard.sh manifest-version)"
          if [ "$manifest_ver" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the workspace version '${manifest_ver}'; release.sh bumps and tags together, so a hand-pushed tag must not skip the bump"
            exit 1
          fi
          prev_tag="$(bash scripts/semver-guard.sh baseline "$tag")"
          kind="$(bash scripts/semver-guard.sh release-type "${prev_tag#v}" "$tag")"
          bash scripts/semver-guard.sh check "$prev_tag" "$kind"

  build:
    name: Build ${{ matrix.asset_name }}
    needs: validate
    permissions:
      contents: read
      id-token: write      # GitHub OIDC — keyless build-provenance attestation
      attestations: write  # actions/attest-build-provenance
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # windows rows need Git Bash; keeps cp + forward-slash paths uniform across OSes
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: plasmoid-updater-linux-x86_64
            ext: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # the build compiles every dependency and needs no git credential
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Prepare asset
        run: cp "target/${{ matrix.target }}/release/plasmoid-updater${{ matrix.ext }}" "${{ matrix.asset_name }}${{ matrix.ext }}"
      - name: Attest build provenance   # keyless SLSA provenance for the asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ matrix.asset_name }}${{ matrix.ext }}
      - name: Upload artifact for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.asset_name }}${{ matrix.ext }}
          path: ${{ matrix.asset_name }}${{ matrix.ext }}
          if-no-files-found: error

  publish:
    name: Publish assets
    needs: [validate, build]
    permissions:
      contents: write      # gh release upload attaches assets to the release
    # Run even when a build leg fails so the binaries that DID ship still get
    # attached with a matching sums file covering exactly what was published.
    # A failed validate skips every build leg, so there is nothing to attach:
    # publish then stays out and leaves the validate failure as the one red.
    # The tag guard still holds under always().
    if: always() && needs.validate.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate sha256sums.txt
        # Glob whatever was actually built so a partial release still matches.
        run: |
          cd artifacts
          sha256sum plasmoid-updater-* > sha256sums.txt
      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # release.sh creates the release (with the full notes) right after the
        # tag push; a missing release here means that step never ran, so this
        # job refuses instead of minting a notes-less release. --clobber keeps
        # re-runs idempotent.
        run: |
          cd artifacts
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::release ${GITHUB_REF_NAME} does not exist; if release.sh's create step failed, run from the repo root: echo y | ./release.sh --retry --workspace --notes CHANGELOG_FILE ${GITHUB_REF_NAME#v}, then re-run this job so the assets attach: gh run rerun ${GITHUB_RUN_ID} --failed — if the tag was hand-pushed, release the next version with release.sh"
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" plasmoid-updater-* sha256sums.txt --clobber --repo "${GITHUB_REPOSITORY}"

  crates:
    name: Publish to crates.io
    needs: [validate, build, publish]
    permissions:
      contents: read
      id-token: write      # GitHub OIDC — crates.io trusted publishing, no stored token
    # Same registry-download workaround as ci.yml: curl's HTTP/2 multiplexing
    # against the crates.io CDN intermittently dies with "[16] Error in the
    # HTTP2 framing layer" on the hosted runners, and the extra retries cover
    # the remaining transient blips. The publish verify build downloads the
    # whole dependency tree from that CDN.
    env:
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_MULTIPLEXING: "false"
    # No always(): unlike an asset, a published crate version cannot be
    # replaced, so this job runs only when validate, every build leg and the
    # release upload all succeeded (a failed needed job skips it).
    if: startsWith(github.ref, 'refs/tags/')
    # A second run for the same tag waits instead of racing the first to
    # crates.io's duplicate refusal, then skips what the first published from
    # the same commit. A tag deleted and re-pushed at another commit while the
    # first run was still on its way passes validate (crates.io had nothing
    # yet), so the publish step's `other` arm is the last stop for a version
    # another commit published. GitHub keeps only one pending run per group:
    # a third arrival cancels the second while it still waits, so the queue
    # never holds more than one.
    concurrency:
      group: crates-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # cargo publish packages the tree and needs no git credential
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # The trusted publisher registered on crates.io for this repo and
      # release.yml is what lets the job's OIDC token buy a registry token.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish the crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # The binary depends on the library by version, so the library goes
        # first, and -e keeps the binary back when the library fails.
        #
        # A version crates.io already has is skipped only when its published
        # .crate proves it was packed from this tag's commit: the version
        # number alone cannot tell a deleted-and-re-pushed tag from the
        # original, so scripts/crates-io-copy.sh (the one check release.sh and
        # validate share) compares the .crate's .cargo_vcs_info.json git.sha1
        # with this checkout's HEAD. A .crate packed from another commit fails
        # the job: crates.io versions are immutable, so this tag can never
        # publish it. Validate refuses it only when the other commit's crates
        # were up before validate ran; a tag deleted and re-pushed while the
        # first run was still publishing gets past validate, so this arm is
        # the last stop. A missing .crate (an HTTP 403 or 404, the normal
        # not-yet-published case) or an answer the script cannot read falls
        # through to cargo publish, whose duplicate refusal decides loudly.
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse HEAD)"
          for crate in libplasmoid-updater plasmoid-updater; do
            answer="$(bash scripts/crates-io-copy.sh "$crate" "$ver")"
            case "$answer" in
              same)
                echo "${crate} ${ver} is already on crates.io from this commit (${commit}), skipping"
                ;;
              "other "*)
                echo "::error::${crate} ${ver} is already on crates.io but was packed from ${answer#other }, not from this tag's ${commit}; crates.io versions are immutable, so this tag cannot publish it: bump to a new version (delete the GitHub release and the tag, then release the next version)" >&2
                exit 1
                ;;
              *)
                if [[ "$answer" == unknown* ]]; then
                  echo "${crate} ${ver}: ${answer}; the publish's duplicate refusal decides"
                fi
                cargo publish --locked -p "$crate"
                ;;
            esac
          done
