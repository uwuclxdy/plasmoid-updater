name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # softprops/action-gh-release creates the release
  id-token: write      # GitHub OIDC — keyless build-provenance attestation (optional)
  attestations: write  # actions/attest-build-provenance (optional)

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag is semver
        # Tightens the `v*` trigger to strict vX.Y.Z — a malformed tag otherwise
        # mints a broken Release page. Pre-release suffixes (`v1.2.3-rc1`) need
        # the regex relaxed.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '${GITHUB_REF_NAME}' is not vX.Y.Z"; exit 1
          fi
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false

  build:
    name: Build ${{ matrix.asset_name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: plasmoid-updater-linux-x86_64
            ext: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Prepare asset
        run: cp "target/${{ matrix.target }}/release/plasmoid-updater${{ matrix.ext }}" "${{ matrix.asset_name }}${{ matrix.ext }}"
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset_name }}${{ matrix.ext }}
      - name: Attest build provenance   # optional supply-chain: keyless SLSA provenance for the asset
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.asset_name }}${{ matrix.ext }}
      - name: Upload artifact for checksum job
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}${{ matrix.ext }}
          path: ${{ matrix.asset_name }}${{ matrix.ext }}
          if-no-files-found: error

  checksums:
    name: Checksums
    needs: [build]
    # Run even when a build leg fails so the binaries that DID ship always have a
    # matching sums file covering exactly what was published.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate sha256sums.txt
        # Glob whatever was actually built so a partial release still produces a
        # sums file matching exactly what shipped.
        run: |
          cd artifacts
          sha256sum plasmoid-updater-* > ../sha256sums.txt
      - name: Upload sha256sums.txt to release
        uses: softprops/action-gh-release@v3
        with:
          files: sha256sums.txt
