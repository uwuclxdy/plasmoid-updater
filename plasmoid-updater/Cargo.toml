[package]
name = "plasmoid-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CLI tool for updating KDE Plasma 6 components from the KDE Store"
keywords = ["kde", "plasma", "widgets", "updater", "cli"]
categories = ["command-line-utilities"]
homepage = "https://github.com/uwuclxdy/plasmoid-updater"
readme = "../README.md"

[[bin]]
name = "plasmoid-updater"
path = "src/main.rs"

[dependencies]
libplasmoid-updater = { workspace = true, features = ["cli", "inhibit"] }
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.1.8"
serde = { workspace = true }
dirs = { workspace = true }
nix = { workspace = true }

[lints]
workspace = true
